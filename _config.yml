# https://github.com/jeffreytse/jekyll-theme-yat/?tab=readme-ov-file#remote-theme-method-with-jekyll-remote-theme-plugin

remote_theme: jeffreytse/jekyll-theme-yat@v1.10.0
plugins:
- jekyll-remote-theme

title: 12th JTTCC
email: 
author: Quantum Physical Chemistry Laboratory, Yokohama City University
copyright: "© 2026 {author}"
description: "Webpage for the 12th Japan-Thai workshop on Theoretical and Computational Chemistry (JTTCC12)"
# favicon: "./favicon.svg"
night_mode: "manual"
brand_color: "#8FC231"

defaults:
  home:
    heading: "The 12th Japan-Thai workshop on Theoretical and Computational Chemistry (JTTCC12)"
    subheading: "12th December 2026 at Yokohama City University (Kanazawa-Hakkei Campus), Yokohama, Japan"
  # banner: "./home1.jpg" # https://www.yokohama-cu.ac.jp/brandguide/materialdata/
    banner: "./yokohama_nightview.jpg" # https://photock.jp/photo/night-view-of-yokohama-from-zou-no-hana-park-4 (Royalty-free)

banner:
  # video: null             # Video banner source
  # loop: true              # Video loop
  # volume: 0               # Video volume (100% is 1.0)
  # start_at: 0             # Video start time
  # image: "Your image url" # Image banner source
  # opacity: 1.0            # Banner opacity (100% is 1.0)
  # background: "#95C8BF"   # Banner background (Could be a image)
  # height: "640px"         # Banner default height
  # min_height: null        # Banner minimum height
  # heading_style: null     # Custom heading style (e.g. "font-weight: bold; text-decoration: underline")
  # subheading_style: null  # Custom subheading style (e.g. color: gold)

code_badge:
  enabled: "true"
  color: "#fff"
  background_color: "#EA5A47"
  text_transform: "uppercase"  # ("uppercase", "lowercase", "capitalize")

